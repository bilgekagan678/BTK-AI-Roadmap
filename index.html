<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTK Akademi — Yapay Zekâ Öğrenme Yol Haritası (Roadmap)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131b2e;
            --bg-card-hover: #1c2742;
            --bg-header: #0f172a;
            --border-color: #23314d;
            --border-glow: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            
            --m1-color: #38bdf8;
            --m2-color: #4ade80;
            --m3-color: #c084fc;
            --m4-color: #fb923c;
            --m5-color: #f43f5e;
            --m6-color: #60a5fa;
            --m7-color: #facc15;
            --m8-color: #a78bfa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 80px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 65%, rgba(192, 132, 252, 0.05) 0%, transparent 40%);
            min-height: 100vh;
        }

        /* Sticky Header & Progress Bar */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #0284c7, #6366f1);
            color: white;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 14px 8px 36px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            width: 220px;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--border-glow);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            width: 260px;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .btn {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: #334155;
            border-color: #475569;
        }

        .btn-danger {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.3);
        }

        .btn-danger:hover {
            background: rgba(248, 113, 113, 0.15);
            border-color: #f87171;
        }

        /* Progress Bar Area */
        .progress-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
        }

        .time-highlight {
            color: #38bdf8;
            font-weight: 600;
        }

        .progress-bar-bg {
            flex: 1;
            height: 12px;
            background: #1e293b;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            border-radius: 6px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
        }

        .progress-text {
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
        }

        /* Flowchart Container */
        .roadmap-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .roadmap-tree {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 28px;
            position: relative;
        }

        /* Flow Node Card */
        .flow-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .flow-card:hover {
            transform: translateY(-4px);
            border-color: #3b82f6;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            padding: 18px 20px;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .module-num {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            color: #0b0f19;
            flex-shrink: 0;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .card-badge {
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.06);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.08);
            white-space: nowrap;
        }

        /* Course Task List */
        .course-list {
            list-style: none;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .course-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            gap: 12px;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid transparent;
        }

        .course-item:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .course-item.completed {
            opacity: 0.65;
            background: rgba(34, 197, 94, 0.05);
        }

        .course-item.completed .course-link {
            text-decoration: line-through;
            color: var(--text-dim);
        }

        /* Custom Checkbox */
        .checkbox-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-wrapper input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: rgba(0,0,0,0.2);
        }

        .checkbox-wrapper input:checked + .custom-checkbox {
            background: #22c55e;
            border-color: #22c55e;
        }

        .custom-checkbox svg {
            display: none;
            width: 12px;
            height: 12px;
            stroke: white;
            stroke-width: 3;
            fill: none;
        }

        .checkbox-wrapper input:checked + .custom-checkbox svg {
            display: block;
        }

        .course-link {
            flex: 1;
            color: var(--text-main);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: color 0.2s;
        }

        .course-link:hover {
            color: var(--border-glow);
        }

        .course-title-text {
            flex: 1;
        }

        .course-duration {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .external-icon {
            opacity: 0;
            transition: opacity 0.2s;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .course-item:hover .external-icon {
            opacity: 1;
        }

        /* Module Theme Styles */
        .m1 .module-num { background-color: var(--m1-color); }
        .m1:hover { border-color: var(--m1-color); }
        
        .m2 .module-num { background-color: var(--m2-color); }
        .m2:hover { border-color: var(--m2-color); }

        .m3 .module-num { background-color: var(--m3-color); }
        .m3:hover { border-color: var(--m3-color); }

        .m4 .module-num { background-color: var(--m4-color); }
        .m4:hover { border-color: var(--m4-color); }

        .m5 .module-num { background-color: var(--m5-color); }
        .m5:hover { border-color: var(--m5-color); }

        .m6 .module-num { background-color: var(--m6-color); }
        .m6:hover { border-color: var(--m6-color); }

        .m7 .module-num { background-color: var(--m7-color); }
        .m7:hover { border-color: var(--m7-color); }

        .m8 .module-num { background-color: var(--m8-color); }
        .m8:hover { border-color: var(--m8-color); }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 60px;
            color: var(--text-dim);
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .roadmap-tree {
                grid-template-columns: 1fr;
            }
            .header-top {
                flex-direction: column;
                align-items: stretch;
            }
            .controls {
                justify-content: space-between;
            }
            .search-box input {
                width: 100%;
            }
            .progress-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
        }
    </style>
</head>

        // "HH:MM:SS" formatını saniyeye çevirme fonksiyonu
        function timeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(':').map(Number);
            if (parts.length === 3) {
                return parts[0] * 3600 + parts[1] * 60 + parts[2];
            } else if (parts.length === 2) {
                return parts[0] * 60 + parts[1];
            }
            return 0;
        }

        // Saniyeyi "X sa Y dk" formatına dönüştürme fonksiyonu
        function secondsToFormattedTime(totalSec) {
            const hours = Math.floor(totalSec / 3600);
            const minutes = Math.floor((totalSec % 3600) / 60);
            if (hours > 0) {
                return `${hours} sa ${minutes} dk`;
            }
            return `${minutes} dk`;
        }

        let completedState = JSON.parse(localStorage.getItem('btk_ai_roadmap_state') || '{}');
        let showOnlyPending = false;

        function getCourseInfo(courseItem) {
            let name = "";
            let url = "";

            if (typeof courseItem === 'string') {
                name = courseItem;
                url = urlMapping[name] || `https://www.btkakademi.gov.tr/portal/catalog?search=${encodeURIComponent(name)}`;
            } else if (typeof courseItem === 'object') {
                name = courseItem.name;
                url = courseItem.url || urlMapping[name] || `https://www.btkakademi.gov.tr/portal/catalog?search=${encodeURIComponent(name)}`;
            }

            return { name, url };
        }

        function renderRoadmap() {
            const container = document.getElementById('roadmapContent');
            container.innerHTML = '';

            let globalCourseIndex = 0;

            roadmapData.forEach((module) => {
                const card = document.createElement('div');
                card.className = `flow-card ${module.id}`;
                card.id = `card-${module.id}`;

                let totalInModule = module.courses.length;
                let completedInModule = 0;

                const courseItemsHtml = module.courses.map((courseItem, cIdx) => {
                    const info = getCourseInfo(courseItem);
                    const courseId = `${module.id}_c${cIdx}`;
                    const isChecked = !!completedState[courseId];
                    if (isChecked) completedInModule++;

                    const durationStr = courseDurations[globalCourseIndex] || "00:00:00";
                    globalCourseIndex++;

                    return `
                        <li class="course-item ${isChecked ? 'completed' : ''}" data-course-id="${courseId}" data-duration="${durationStr}" data-title="${info.name.toLowerCase()}">
                            <label class="checkbox-wrapper" onclick="event.stopPropagation()">
                                <input type="checkbox" id="${courseId}" ${isChecked ? 'checked' : ''} onchange="toggleCourse('${courseId}')">
                                <span class="custom-checkbox">
                                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </span>
                            </label>
                            <a href="${info.url}" target="_blank" class="course-link" title="BTK Akademi'de Gör">

                                <span class="course-duration">${durationStr}</span>

                            </a>
                        </li>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title-group">
                            <div class="module-num">${module.num}</div>
                            <div class="card-title">${module.title}</div>
                        </div>
                        <span class="card-badge" id="badge-${module.id}">${completedInModule}/${totalInModule}</span>
                    </div>
                    <ul class="course-list">
                        ${courseItemsHtml}
                    </ul>
                `;

                container.appendChild(card);
            });

            updateProgress();
        }

        function toggleCourse(courseId) {
            completedState[courseId] = !completedState[courseId];
            if (!completedState[courseId]) {
                delete completedState[courseId];
            }
            localStorage.setItem('btk_ai_roadmap_state', JSON.stringify(completedState));
            
            // Update item UI
            const itemEl = document.querySelector(`[data-course-id="${courseId}"]`);
            if (itemEl) {
                if (completedState[courseId]) {
                    itemEl.classList.add('completed');
                } else {
                    itemEl.classList.remove('completed');
                }
            }

            // Update badges & progress bar
            updateModuleBadges();
            updateProgress();

            if (showOnlyPending) {
                filterCourses();
            }
        }

        function updateModuleBadges() {
            roadmapData.forEach(module => {
                let completedInModule = 0;
                let moduleTotalSeconds = 0;
                let moduleCompletedSeconds = 0;

                module.courses.forEach((_, cIdx) => {
                    const courseId = `${module.id}_c${cIdx}`;
                    const itemEl = document.querySelector(`[data-course-id="${courseId}"]`);
                    const durationStr = itemEl ? itemEl.getAttribute('data-duration') : "00:00:00";
                    const sec = timeToSeconds(durationStr);

                    moduleTotalSeconds += sec;

                    if (completedState[courseId]) {
                        completedInModule++;
                        moduleCompletedSeconds += sec;
                    }
                });

                const badgeEl = document.getElementById(`badge-${module.id}`);
                if (badgeEl) {
                    badgeEl.innerText = `${completedInModule}/${module.courses.length} (${secondsToFormattedTime(moduleCompletedSeconds)})`;
                }
            });
        }

        function updateProgress() {
            let totalCourses = 0;
            let totalSeconds = 0;
            let checkedSeconds = 0;

            roadmapData.forEach(m => totalCourses += m.courses.length);

            let checkedCourses = Object.keys(completedState).length;

            document.querySelectorAll('.course-item').forEach(item => {
                const durationStr = item.getAttribute('data-duration');
                const sec = timeToSeconds(durationStr);
                totalSeconds += sec;

                if (item.classList.contains('completed')) {
                    checkedSeconds += sec;
                }
            });

            let percent = totalCourses > 0 ? Math.round((checkedCourses / totalCourses) * 100) : 0;

            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressText').innerText = `${checkedCourses} / ${totalCourses} Tamamlandı (%${percent})`;
            
            document.getElementById('completedTimeText').innerText = secondsToFormattedTime(checkedSeconds);
            document.getElementById('totalTimeText').innerText = secondsToFormattedTime(totalSeconds);
        }

        function filterCourses() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            document.querySelectorAll('.course-item').forEach(item => {
                const title = item.getAttribute('data-title');
                const isCompleted = item.classList.contains('completed');

                let matchesSearch = title.includes(query);
                let matchesFilter = !showOnlyPending || !isCompleted;

                if (matchesSearch && matchesFilter) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });

            // Hide empty module cards during search
            roadmapData.forEach(module => {
                const card = document.getElementById(`card-${module.id}`);
                const visibleItems = card.querySelectorAll('.course-item[style="display: flex;"], .course-item:not([style*="display: none"])');
                if (query.length > 0 || showOnlyPending) {
                    card.style.display = visibleItems.length > 0 ? 'block' : 'none';
                } else {
                    card.style.display = 'block';
                }
            });
        }

        function toggleFilterCompleted() {
            showOnlyPending = !showOnlyPending;
            const btnText = document.getElementById('filterBtnText');
            if (showOnlyPending) {
                btnText.innerText = "👀 Tümünü Göster";
            } else {
                btnText.innerText = "🎯 Sadece Eksikleri Göster";
            }
            filterCourses();
        }

        function resetProgress() {
            if (confirm("Tüm tamamlanma durumunu sıfırlamak istediğinize emin misiniz?")) {
                completedState = {};
                localStorage.removeItem('btk_ai_roadmap_state');
                renderRoadmap();
            }
        }

        renderRoadmap();
